name: research-log-local

services:
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
  backend:
    ports:
      - "127.0.0.1:8081:8080"
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/research_log
      SPRING_DATASOURCE_USERNAME: researchlog
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    secrets:
      - source: app_db_password
        target: spring.datasource.password
    depends_on:
      db:
        condition: service_healthy
  db:
    build:
      context: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_log
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_log"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
